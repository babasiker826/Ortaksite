<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özsoy / ATAY CHECKER - Checker Araçları</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050507;
            --panel-bg: #0c0c10;
            --accent: #ff2d55;
            --accent-glow: rgba(255, 45, 85, 0.6);
            --neon-green: #00ffa3;
            --neon-blue: #00a8ff;
            --neon-purple: #9c27b0;
            --sidebar-w: 280px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Rajdhani', sans-serif; 
        }
        
        body { 
            background: var(--bg-dark); 
            color: #e0e0e0; 
            overflow-x: hidden; 
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--panel-bg);
            position: fixed;
            left: -280px; /* Kapalı başlar */
            top: 0;
            border-right: 1px solid #1a1a20;
            z-index: 1000;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar.active { 
            left: 0; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        /* PROFIL KISMI */
        .profile-card {
            padding: 20px 15px;
            border-bottom: 1px solid #1a1a20;
            background: linear-gradient(180deg, #111116 0%, transparent 100%);
        }

        .profile-flex { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 15px;
        }

        .avatar-wrapper {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--accent);
        }

        .avatar-wrapper img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .profile-details h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* MENÜ KATEGORİ SİSTEMİ */
        .menu-label { 
            padding: 18px 15px 6px; 
            font-size: 11px; 
            text-transform: uppercase; 
            color: var(--accent); 
            letter-spacing: 1.5px; 
            font-weight: bold; 
        }

        .nav-category { 
            cursor: pointer; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .nav-link {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #8d8d99;
            transition: 0.3s;
            border-left: 3px solid transparent;
        }

        .nav-link:hover {
            background: rgba(255, 45, 85, 0.05);
            border-left-color: var(--accent);
            color: #fff;
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            transition: max-height 0.4s ease-out;
        }

        .nav-category.open .submenu { 
            max-height: 2000px; 
        }
        
        .nav-category.open .chevron { 
            transform: rotate(180deg); 
        }

        .sub-link {
            padding: 10px 15px 10px 40px;
            font-size: 13px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .sub-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
            border-left-color: var(--neon-green);
            padding-left: 43px;
        }

        /* Badge Stilleri */
        .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .free-badge {
            background: rgba(0, 255, 163, 0.15);
            color: var(--neon-green);
            border: 1px solid rgba(0, 255, 163, 0.3);
        }

        .vip-badge {
            background: rgba(255, 45, 85, 0.15);
            color: var(--accent);
            border: 1px solid rgba(255, 45, 85, 0.3);
        }

        /* Çıkış Butonu */
        .logout-btn {
            margin-top: auto;
            padding: 15px;
            border-top: 1px solid #1a1a20;
        }

        .logout-btn .nav-link {
            color: #ff4d4d;
        }

        .logout-btn .nav-link:hover {
            background: rgba(255, 77, 77, 0.1);
            border-left-color: #ff4d4d;
        }

        /* SAĞ ÜST BUTONLAR - ALT ALTA SIRA */
        .right-controls {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1001;
            align-items: flex-end;
        }

        .btn-top {
            background: var(--panel-bg);
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100px;
            justify-content: center;
            text-decoration: none;
        }

        .btn-top:hover { 
            background: #1a1a20; 
            border-color: var(--accent); 
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* MENÜ AÇMA BUTONU - SOL ÜST */
        .menu-open-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--accent);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100px;
            justify-content: center;
            z-index: 1002;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .sidebar.active ~ .menu-open-btn {
            opacity: 0.5;
            pointer-events: none;
        }

        .menu-open-btn:hover {
            background: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ANA İÇERİK */
        .main-wrapper { 
            min-height: 100vh;
            padding: 100px 20px 40px 20px;
            transition: 0.3s;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* NEON BAŞLIK */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--accent);
        }

        .page-subtitle {
            font-size: 16px;
            color: #aaa;
            max-width: 800px;
            margin: 0 auto;
        }

        /* CHECKER DETAY SAYFASI */
        .checker-detail {
            max-width: 800px;
            margin: 0 auto;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #1a1a20;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
            text-decoration: none;
        }

        .back-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a1a20;
        }

        .detail-icon {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            background: rgba(255, 45, 85, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 36px;
        }

        .detail-info h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: #fff;
            margin-bottom: 5px;
        }

        .detail-meta {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #aaa;
            flex-wrap: wrap;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .detail-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            border-left: 3px solid var(--accent);
        }

        .item-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .item-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #fff;
        }

        .download-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 30px;
            margin-top: 30px;
            text-align: center;
            border: 1px solid rgba(255, 45, 85, 0.3);
        }

        .download-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #fff;
            margin-bottom: 20px;
        }

        .password-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            border-left: 3px solid var(--neon-green);
        }

        .password-label {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
        }

        .password-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: var(--neon-green);
            letter-spacing: 1px;
        }

        .warning-box {
            background: rgba(255, 45, 85, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin: 25px 0;
            border: 1px solid rgba(255, 45, 85, 0.3);
        }

        .warning-title {
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .warning-text {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
        }

        .download-button {
            background: linear-gradient(135deg, var(--accent), #ff6b6b);
            border: none;
            color: #fff;
            padding: 20px 40px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px auto;
            width: 100%;
            max-width: 400px;
            text-decoration: none;
        }

        .download-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 45, 85, 0.4);
        }

        /* OVERLAY */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
        }

        .overlay.active { 
            display: block; 
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .menu-open-btn {
                left: 10px;
                top: 10px;
                padding: 6px 10px;
                font-size: 11px;
                width: 90px;
            }
            
            .right-controls { 
                right: 10px; 
                top: 10px; 
                gap: 6px;
            }
            
            .btn-top { 
                padding: 6px 10px; 
                font-size: 11px;
                width: 90px;
            }
            
            .main-wrapper { 
                padding: 120px 10px 20px 10px; 
            }
            
            .page-title {
                font-size: 24px;
            }
            
            .page-subtitle {
                font-size: 14px;
            }
            
            .checker-detail {
                padding: 20px;
            }
            
            .detail-header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .detail-icon {
                width: 70px;
                height: 70px;
                font-size: 32px;
            }
            
            .detail-info h2 {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .right-controls {
                flex-direction: column;
            }
            
            .btn-top, .menu-open-btn { 
                width: 80px;
                font-size: 10px;
            }
            
            .main-wrapper {
                padding: 140px 10px 20px 10px;
            }
            
            .detail-grid {
                grid-template-columns: 1fr;
            }
            
            .download-button {
                padding: 15px 25px;
                font-size: 16px;
            }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--panel-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-glow);
        }
    </style>
</head>

    <script>
        // CHECKER LİSTESİ
        const checkerList = {

                link: 'https://drive.google.com/file/d/1DzRJQza0rGiRh2IKLgwubsergBkQrr8w/view?usp=drivesdk'
            },
            // BLU TV Checker
            'blutv': {
                id: 'blutv',
                name: 'BLU TV CHECKER',
                icon: 'fas fa-film',
                version: 'v1.2.0',
                size: '68 MB',
                status: 'ÇALIŞIYOR',

                password: 'yok',
                link: 'https://drive.google.com/file/d/16qRpOiV6aJfxCSDesgDOyreMxqr5xNG3/view?usp=drivesdk'
            },
            // PUBG Checker
            'pubg': {

            // Cramly AI Checker

            'dosya': {

        // SAYFA YÜKLENDİĞİNDE
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Checker sayfası yüklendi!');
            
            // URL'den checker ID'sini al
            const urlParams = new URLSearchParams(window.location.search);
            const checkerId = urlParams.get('checker');
            
            if (checkerId && checkerList[checkerId]) {
                showCheckerDetail(checkerId);
            } else {
                // URL'de checker yoksa varsayılan olarak pubg göster
                showCheckerDetail('pubg');
            }
        });

        // CHECKER DETAYINI GÖSTER
        function showCheckerDetail(checkerId) {
            const checker = checkerList[checkerId];
            
            if (!checker) {
                alert('Checker bulunamadı!');
                return;
            }
            
            const mainWrapper = document.getElementById('mainWrapper');
            mainWrapper.innerHTML = `
                <!-- SAYFA BAŞLIĞI -->
                <div class="page-header">
                    <h1 class="page-title">CHECKER İNDİRME</h1>
                    <p class="page-subtitle">${checker.name} - ${checker.description}</p>
                </div>

                <div class="checker-detail">
                    <button class="back-button" onclick="goToDashboard()">
                        <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
                    </button>
                    
                    <div class="detail-header">
                        <div class="detail-icon">
                            <i class="${checker.icon}"></i>
                        </div>
                        <div class="detail-info">
                            <h2>${checker.name}</h2>
                            <div class="detail-meta">
                                <span><i class="fas fa-code-branch"></i> ${checker.version}</span>
                                <span><i class="fas fa-hdd"></i> ${checker.size}</span>
                                <span><i class="fas fa-circle" style="color: var(--neon-green);"></i> ${checker.status}</span>
                                <span><i class="fas fa-calendar-alt"></i> ${checker.lastUpdate}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="item-label">Versiyon</div>
                            <div class="item-value">${checker.version}</div>
                        </div>
                        <div class="detail-item">
                            <div class="item-label">Dosya Boyutu</div>
                            <div class="item-value">${checker.size}</div>
                        </div>
                        <div class="detail-item">
                            <div class="item-label">Durum</div>
                            <div class="item-value" style="color: var(--neon-green);">${checker.status}</div>
                        </div>
                        <div class="detail-item">
                            <div class="item-label">Son Güncelleme</div>
                            <div class="item-value">${checker.lastUpdate}</div>
                        </div>
                    </div>
                    
                    <div class="warning-box">
                        <div class="warning-title">
                            <i class="fas fa-exclamation-triangle"></i> ÖNEMLİ UYARI!
                        </div>
                        <div class="warning-text">
                            ⚠️ Antivirüs programları checker araçlarını zararlı yazılım olarak algılayabilir. Bu tamamen normal bir durumdur.<br><br>
                            
                            ✅ İndirdiğiniz dosyayı çalıştırmadan önce antivirüsünüzü geçici olarak devre dışı bırakmanız gerekebilir.<br><br>
                            
                            🔒 Tüm checker araçları güvenlidir ve test edilmiştir. Güvenle kullanabilirsiniz.
                        </div>
                    </div>
                    
                    <div class="download-section">
                        <h3 class="download-title">${checker.name} İNDİRME</h3>
                        
                        <div class="password-info">
                            <div class="password-label">PROGRAM ŞİFRESİ:</div>
                            <div class="password-value">${checker.password}</div>
                        </div>
                        
                        <a href="${checker.link}" target="_blank" class="download-button" onclick="downloadChecker('${checker.link}', '${checker.name}')">
                            <i class="fas fa-download"></i> ${checker.name} İNDİR
                        </a>
                        
                        <p style="text-align: center; color: #777; font-size: 14px; margin-top: 15px;">
                            İndirme başladığında dosya Google Drive'da açılacaktır.<br>
                            İndirdikten sonra dosyayı şifre ile açınız.
                        </p>
                    </div>
                </div>
            `;
        }

        // CHECKER İNDİRME
        function downloadChecker(link, checkerName) {
            console.log('Checker indiriliyor:', checkerName);
            
            // İndirme başladı uyarısı
            alert(`✅ ${checkerName} indirilmeye başlandı!\n\n🔑 Program şifresi: @devrelax\n\n⚠️ Antivirüs uyarılarını göz ardı ediniz.`);
        }

        // CHECKER'A GİT
        function goToChecker(checkerId) {
            // Menüyü kapat (mobilde)
            if (window.innerWidth <= 768) {
                toggleSidebar();
            }
            
            // Checker sayfasına yönlendir
            window.location.href = `checker.html?checker=${checkerId}`;
        }

        // ANA SAYFAYA DÖN
        function goToDashboard() {
            window.location.href = 'index.html';
        }

        // MENÜ AÇMA/KAPAMA FONKSİYONU
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            
            if (sidebar.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }

        // KATEGORİ AÇMA/KAPAMA FONKSİYONU
        function toggleCat(catId) {
            const category = document.getElementById(catId);
            category.classList.toggle('open');
        }

        // SCROLL TO CHECKER (ilk versiyon için)
        function scrollToChecker(checkerId) {
            const element = document.getElementById(`${checkerId}-checker`);
            if (element) {
                // Menüyü kapat (mobilde)
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
                
                // Elemente scroll et
                element.scrollIntoView({ 
                    behavior: 'smooth',
                    block: 'start'
                });
                
                // Vurgu efekti ekle
                element.style.borderColor = 'var(--accent)';
                element.style.boxShadow = '0 0 30px rgba(255, 45, 85, 0.3)';
                
                setTimeout(() => {
                    element.style.borderColor = '#1a1a20';
                    element.style.boxShadow = 'none';
                }, 2000);
            }
        }

        // OVERLAY TIKLAMA
        document.getElementById('overlay').addEventListener('click', toggleSidebar);

        // ESC TUŞU İLE MENÜYÜ KAPAT
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('active')) {
                    toggleSidebar();
                }
            }
        });

        // Mobil dokunma optimizasyonu
        document.addEventListener('touchstart', function() {}, {passive: true});
    </script>
</body>
</html>
