<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenlik Doğrulaması - sorgupaneli.2026tr.xyz</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <style>
        body {
            background-color: #222222;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.8s ease-in;
        }

        h1 { 
            font-size: 24px; 
            margin-bottom: 10px; 
            font-weight: 500; 
        }
        
        .sub-text { 
            font-size: 16px; 
            margin-bottom: 25px; 
            color: #eee; 
            line-height: 1.4; 
        }

        .verify-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #444;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .verify-container:hover { 
            background: rgba(255, 255, 255, 0.05); 
            border-color: #666; 
        }

        .verify-container:active {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(0.99);
        }

        .left-side { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        .check-box {
            width: 26px;
            height: 26px;
            border: 2px solid #555;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #333;
            flex-shrink: 0;
        }

        .spinner {
            display: none;
            position: relative;
            width: 20px;
            height: 20px;
        }
        
        .dot {
            position: absolute;
            width: 3.5px;
            height: 3.5px;
            background: #2ecc71;
            border-radius: 50%;
            animation: cf-spin 1s infinite linear;
        }
        
        .dot:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
        .dot:nth-child(2) { top: 15%; right: 15%; animation-delay: 0.1s; }
        .dot:nth-child(3) { top: 50%; right: 0; transform: translateY(-50%); animation-delay: 0.2s; }
        .dot:nth-child(4) { bottom: 15%; right: 15%; animation-delay: 0.3s; }
        .dot:nth-child(5) { bottom: 0; left: 50%; transform: translateX(-50%); animation-delay: 0.4s; }
        .dot:nth-child(6) { bottom: 15%; left: 15%; animation-delay: 0.5s; }
        .dot:nth-child(7) { top: 50%; left: 0; transform: translateY(-50%); animation-delay: 0.6s; }
        .dot:nth-child(8) { top: 15%; left: 15%; animation-delay: 0.7s; }

        @keyframes cf-spin { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.2; } 
        }

        .done-icon { 
            display: none; 
            color: #2ecc71; 
            font-size: 20px; 
            font-weight: bold; 
        }

        .status-msg { 
            font-size: 14px; 
            color: #fff; 
        }

        .right-side { 
            text-align: right; 
            min-width: 80px; 
        }
        
        .logo-text { 
            font-size: 11px; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
            margin: 0; 
        }
        
        .links { 
            font-size: 9px; 
            color: #999; 
            text-decoration: underline; 
        }

        .info-footer { 
            margin-top: 25px; 
            font-size: 14px; 
            color: #aaa; 
        }

        .success-message {
            color: #2ecc71;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: rgba(46, 204, 113, 0.1);
            border-radius: 4px;
        }

        .redirect-info {
            color: #3498db;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @media (max-width: 480px) {
            h1 { font-size: 20px; }
            .sub-text { font-size: 15px; }
            .verify-container { padding: 12px 15px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>sorgupaneli.2026tr.xyz</h1>
    <p class="sub-text">İnsan olduğunuzu doğrulamak için lütfen kutucuğa dokunun.</p>

    <div class="verify-container" id="mainBox" tabindex="0">
        <div class="left-side">
            <div class="check-box" id="boxFrame">
                <div class="spinner" id="loader">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
                <div class="done-icon" id="okIcon">✓</div>
            </div>
            <span class="status-msg" id="msg">İnsan olduğunuzu doğrulayın</span>
        </div>
        
        <div class="right-side">
            <p class="logo-text">CLOUDFLARE</p>
            <span class="links">Gizlilik • Şartlar</span>
        </div>
    </div>

    <div class="success-message" id="successMessage"></div>
    <div class="redirect-info" id="redirectInfo"></div>

    <p class="info-footer">Bağlantınızın güvenliği kontrol ediliyor.</p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const mainBox = document.getElementById('mainBox');
        const boxFrame = document.getElementById('boxFrame');
        const loader = document.getElementById('loader');
        const okIcon = document.getElementById('okIcon');
        const msg = document.getElementById('msg');
        const successMessage = document.getElementById('successMessage');
        const redirectInfo = document.getElementById('redirectInfo');
        
        const urlParams = new URLSearchParams(window.location.search);
        const nextPage = urlParams.get('next') || '/login';
        
        mainBox.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            startVerification();
        });
        
        mainBox.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                startVerification();
            }
        });
        
        async function startVerification() {
            mainBox.style.pointerEvents = "none";
            mainBox.style.cursor = "default";
            mainBox.style.opacity = "0.8";
            boxFrame.style.border = "none";
            loader.style.display = "block";
            msg.innerText = "Doğrulanıyor...";
            
            setTimeout(() => {
                loader.style.display = "none";
                okIcon.style.display = "block";
                msg.innerText = "Doğrulandı";
                
                successMessage.textContent = 'Doğrulama başarılı!';
                successMessage.style.display = 'block';
                
                redirectInfo.textContent = `${nextPage} sayfasına yönlendiriliyorsunuz...`;
                redirectInfo.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = nextPage;
                }, 1500);
            }, 4000);
        }
    });
</script>
</body>
</html>
